name: Update Bilibili follower count

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch follower count
        shell: bash
        run: |
          set -euo pipefail

          response=$(curl --fail --silent --show-error --retry 3 \
            --user-agent "Mozilla/5.0" \
            --referer "https://www.bilibili.com/" \
            "https://api.bilibili.com/x/relation/stat?vmid=3461574540921489")

          count=$(printf '%s' "$response" | jq -r '.data.follower')
          if ! [[ "$count" =~ ^[0-9]+$ ]]; then
            echo "Bilibili returned an invalid follower count" >&2
            exit 1
          fi

          current=$(jq -r '.follower // 0' milky/followers.json)
          if (( (count + 50) / 100 == (current + 50) / 100 )); then
            echo "Displayed follower count is unchanged."
            exit 0
          fi

          jq -n \
            --argjson follower "$count" \
            --arg updated_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{ follower: $follower, updated_at: $updated_at }' \
            > milky/followers.json

      - name: Commit updated count
        shell: bash
        run: |
          if git diff --quiet -- milky/followers.json; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add milky/followers.json
          git commit -m "Update Bilibili follower count"
          git push
