<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="The personal website of Cornelia Zhang."
    />
    <meta name="theme-color" content="#15181d" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2315181d'/%3E%3Cpath d='M42 20c-2.6-3-6.1-4.5-10.3-4.5C22.5 15.5 16 22.2 16 32s6.5 16.5 15.7 16.5c4.2 0 7.7-1.5 10.3-4.5' fill='none' stroke='%23f2eade' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='44' cy='32' r='3.5' fill='%23ef6a45'/%3E%3C/svg%3E"
    />
    <title>Cornelia Zhang</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #15181d;
        color: #f2eade;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 76% 22%, rgba(239, 106, 69, 0.16), transparent 28rem),
          #15181d;
      }

      body::before {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-image:
          linear-gradient(rgba(242, 234, 222, 0.055) 1px, transparent 1px),
          linear-gradient(90deg, rgba(242, 234, 222, 0.055) 1px, transparent 1px);
        background-size: 4.5rem 4.5rem;
        content: "";
        mask-image: linear-gradient(to bottom, black, transparent 78%);
      }

      main {
        display: grid;
        min-height: 100vh;
        grid-template-rows: auto 1fr auto;
        padding: clamp(1.5rem, 4vw, 3.75rem);
      }

      header,
      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #a9a9a2;
        font-size: 0.82rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .mark {
        display: grid;
        width: 2.35rem;
        height: 2.35rem;
        place-items: center;
        border: 1px solid rgba(242, 234, 222, 0.25);
        border-radius: 50%;
        color: #f2eade;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1rem;
        letter-spacing: 0;
        text-transform: none;
      }

      .intro {
        align-self: center;
        max-width: 68rem;
        padding: 6vh 0;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin: 0 0 1.35rem;
        color: #ef6a45;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 2.5rem;
        height: 1px;
        background: currentColor;
        content: "";
      }

      h1 {
        max-width: 11ch;
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(4rem, 12vw, 9.5rem);
        font-weight: 400;
        letter-spacing: -0.065em;
        line-height: 0.84;
      }

      .note {
        max-width: 31rem;
        margin: clamp(2rem, 5vw, 3.75rem) 0 0;
        color: #bebdb5;
        font-size: clamp(1rem, 1.6vw, 1.2rem);
        line-height: 1.7;
      }

      footer {
        border-top: 1px solid rgba(242, 234, 222, 0.14);
        padding-top: 1.25rem;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 0.65rem;
      }

      .status::before {
        width: 0.45rem;
        height: 0.45rem;
        border-radius: 50%;
        background: #ef6a45;
        content: "";
        box-shadow: 0 0 0 0 rgba(239, 106, 69, 0.5);
        animation: pulse 2.8s ease-out infinite;
      }

      @keyframes pulse {
        45% {
          box-shadow: 0 0 0 0.45rem rgba(239, 106, 69, 0);
        }
      }

      @media (max-width: 40rem) {
        body::before {
          background-size: 3.5rem 3.5rem;
        }

        header span:last-child,
        footer span:last-child {
          display: none;
        }

        h1 {
          font-size: clamp(4rem, 21vw, 6.5rem);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .status::before {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <span class="mark" aria-label="Cornelia Zhang">C</span>
        <span>Personal site · 2026</span>
      </header>

      <section class="intro" aria-labelledby="site-title">
        <p class="eyebrow">A new space is taking shape</p>
        <h1 id="site-title">Cornelia Zhang</h1>
        <p class="note">
          This is the beginning of something new. The full site is on its way;
          for now, consider this a quiet hello.
        </p>
      </section>

      <footer>
        <span class="status">In progress</span>
        <span>corneliazhang.me</span>
      </footer>
    </main>
  </body>
</html>
